name: Process Order

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      url:
        description: 视频链接
        required: true
      targets:
        description: 目标JSON,如 {"play":100,"share":50,"like":100,"heart":50}
        required: true

permissions:
  contents: write
  issues: write

# 并发串行:同一时间只允许一个 run 执行,避免订单数据互相覆盖/重复执行
concurrency:
  group: sph-remote-run
  cancel-in-progress: false

jobs:
  order:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'order:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 检查暂停状态
        id: paused
        run: |
          if [ -f data/pause.flag ]; then echo "PAUSED=yes" >> "$GITHUB_ENV"; else echo "PAUSED=no" >> "$GITHUB_ENV"; fi

      - name: 已暂停则拒绝新订单
        if: ${{ env.PAUSED == 'yes' && github.event_name == 'issues' }}
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⏸️ 系统已暂停下单。请在网页「日志」页点击「启动」后再提交。'
            });
            github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

      - uses: actions/setup-python@v5
        if: ${{ env.PAUSED != 'yes' }}
        with:
          python-version: '3.12'

      - name: 安装依赖(xvfb 提供虚拟显示,供真实窗口模式浏览器使用)
        if: ${{ env.PAUSED != 'yes' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: 自动下单(真实窗口模式)
        id: run
        if: ${{ env.PAUSED != 'yes' }}
        run: |
          # 直接在 bash 内取输入(避免 GITHUB_ENV 中转丢失 JSON 引号)
          if [ "$EVENT" = "workflow_dispatch" ]; then
            URL="$INPUT_URL"
            TARGETS="$INPUT_TARGETS"
          else
            URL="${ISSUE_TITLE#order: }"
            TARGETS="$ISSUE_BODY"
          fi
          echo "处理订单: $URL"
          echo "目标: $TARGETS"
          xvfb-run -a python remote/main.py order "$URL" "$TARGETS" 2>&1 | tee /tmp/result.txt
        env:
          EVENT: ${{ github.event_name }}
          INPUT_URL: ${{ inputs.url }}
          INPUT_TARGETS: ${{ inputs.targets }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          JUZI_ACCOUNT: ${{ secrets.JUZI_ACCOUNT }}
          JUZI_PASSWORD: ${{ secrets.JUZI_PASSWORD }}
          JUZI_PLAY_GOODS: ${{ secrets.JUZI_PLAY_GOODS }}
          JUZI_FORWARD_GOODS: ${{ secrets.JUZI_FORWARD_GOODS }}
          IMT_ACCOUNT: ${{ secrets.IMT_ACCOUNT }}
          IMT_PASSWORD: ${{ secrets.IMT_PASSWORD }}
          IMT_LIKE_GOODS: ${{ secrets.IMT_LIKE_GOODS }}
          IMT_HEART_GOODS: ${{ secrets.IMT_HEART_GOODS }}
          JUZI_COOKIE: ${{ secrets.JUZI_COOKIE }}
          IMT_COOKIE: ${{ secrets.IMT_COOKIE }}
          JUZI_LOCALSTORAGE: ${{ secrets.JUZI_LOCALSTORAGE }}
          IMT_LOCALSTORAGE: ${{ secrets.IMT_LOCALSTORAGE }}

      - name: 提交订单数据
        if: ${{ env.PAUSED != 'yes' }}
        run: |
          git config user.name "sph-bot"
          git config user.email "sph-bot@users.noreply.github.com"
          mkdir -p docs/data
          cp data/orders.json docs/data/orders.json
          git add data/orders.json docs/data/orders.json
          git diff --cached --quiet && exit 0
          git commit -m "order update [skip ci]"
          git pull --rebase origin main || true
          git push

      - name: 回写结果到 issue
        if: ${{ github.event_name == 'issues' && env.PAUSED != 'yes' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.readFileSync('/tmp/result.txt', 'utf8').trim();
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: text || '处理完成'
            });
            github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
