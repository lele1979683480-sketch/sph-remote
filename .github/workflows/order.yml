name: Process Order

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      url:
        description: 视频链接
        required: true
      targets:
        description: 目标JSON,如 {"play":2500,"like":30}
        required: true

permissions:
  contents: write
  issues: write

jobs:
  order:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'order:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: 解析订单参数
        id: parse
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "URL=${{ inputs.url }}" >> "$GITHUB_ENV"
            echo "TARGETS=${{ inputs.targets }}" >> "$GITHUB_ENV"
          else
            URL="${{ github.event.issue.title }}"
            URL="${URL#order: }"
            echo "URL=$URL" >> "$GITHUB_ENV"
            echo "TARGETS=${{ github.event.issue.body }}" >> "$GITHUB_ENV"
          fi

      - name: 自动下单
        id: run
        run: |
          python remote/main.py order "$URL" "$TARGETS" 2>&1 | tee /tmp/result.txt
        env:
          JUZI_ACCOUNT: ${{ secrets.JUZI_ACCOUNT }}
          JUZI_PASSWORD: ${{ secrets.JUZI_PASSWORD }}
          JUZI_PLAY_GOODS: ${{ secrets.JUZI_PLAY_GOODS }}
          JUZI_FORWARD_GOODS: ${{ secrets.JUZI_FORWARD_GOODS }}
          IMT_ACCOUNT: ${{ secrets.IMT_ACCOUNT }}
          IMT_PASSWORD: ${{ secrets.IMT_PASSWORD }}

      - name: 提交订单数据
        run: |
          git config user.name "sph-bot"
          git config user.email "sph-bot@users.noreply.github.com"
          git add data/orders.json
          git diff --cached --quiet || git commit -m "order update [skip ci]"
          git push

      - name: 回写结果到 issue
        if: ${{ github.event_name == 'issues' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.readFileSync('/tmp/result.txt', 'utf8').trim();
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: text || '处理完成'
            });
            github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
