name: Process Order

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      url:
        description: 视频链接
        required: true
      targets:
        description: 目标JSON,如 {"play":2500,"like":30}
        required: true

permissions:
  contents: write
  issues: write

jobs:
  order:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'order:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 检查暂停状态
        id: paused
        run: |
          if [ -f data/pause.flag ]; then echo "PAUSED=yes" >> "$GITHUB_ENV"; else echo "PAUSED=no" >> "$GITHUB_ENV"; fi

      - name: 已暂停则拒绝新订单
        if: ${{ env.PAUSED == 'yes' && github.event_name == 'issues' }}
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⏸️ 系统已暂停下单。请在网页「日志」页点击「启动」后再提交。'
            });
            github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

      - uses: actions/setup-python@v5
        if: ${{ env.PAUSED != 'yes' }}
        with:
          python-version: '3.12'

      - name: 安装依赖
        if: ${{ env.PAUSED != 'yes' }}
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: 解析订单参数
        id: parse
        if: ${{ env.PAUSED != 'yes' }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "URL=$INPUT_URL" >> "$GITHUB_ENV"
            echo "TARGETS=$INPUT_TARGETS" >> "$GITHUB_ENV"
          else
            URL="${ISSUE_TITLE#order: }"
            echo "URL=$URL" >> "$GITHUB_ENV"
            echo "TARGETS=$ISSUE_BODY" >> "$GITHUB_ENV"
          fi
        env:
          EVENT: ${{ github.event_name }}
          INPUT_URL: ${{ inputs.url }}
          INPUT_TARGETS: ${{ inputs.targets }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: 自动下单
        id: run
        if: ${{ env.PAUSED != 'yes' }}
        run: |
          python remote/main.py order "$URL" "$TARGETS" 2>&1 | tee /tmp/result.txt
        env:
          JUZI_ACCOUNT: ${{ secrets.JUZI_ACCOUNT }}
          JUZI_PASSWORD: ${{ secrets.JUZI_PASSWORD }}
          JUZI_PLAY_GOODS: ${{ secrets.JUZI_PLAY_GOODS }}
          JUZI_FORWARD_GOODS: ${{ secrets.JUZI_FORWARD_GOODS }}
          IMT_ACCOUNT: ${{ secrets.IMT_ACCOUNT }}
          IMT_PASSWORD: ${{ secrets.IMT_PASSWORD }}

      - name: 提交订单数据
        if: ${{ env.PAUSED != 'yes' }}
        run: |
          git config user.name "sph-bot"
          git config user.email "sph-bot@users.noreply.github.com"
          git add data/orders.json
          git diff --cached --quiet && exit 0
          git commit -m "order update [skip ci]"
          git pull --rebase origin main || true
          git push

      - name: 回写结果到 issue
        if: ${{ github.event_name == 'issues' && env.PAUSED != 'yes' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.readFileSync('/tmp/result.txt', 'utf8').trim();
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: text || '处理完成'
            });
            github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
