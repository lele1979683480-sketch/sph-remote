name: Check Progress

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      order_no:
        description: 指定订单号(留空检查全部)
        required: false

permissions:
  contents: write

# 与下单共享并发组:同组串行执行,避免 orders.json 并发写覆盖
concurrency:
  group: sph-remote-run
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: 抓取数据检查达标
        run: python remote/main.py check ${{ github.event.inputs.order_no }}

      - name: 提交更新
        run: |
          git config user.name "sph-bot"
          git config user.email "sph-bot@users.noreply.github.com"
          mkdir -p docs/data
          cp data/orders.json docs/data/orders.json
          git add data/orders.json docs/data/orders.json
          git diff --cached --quiet || git commit -m "progress check [skip ci]"
          git push
