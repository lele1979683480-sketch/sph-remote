name: Check Progress

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: 抓取数据检查达标
        run: python remote/main.py check

      - name: 提交更新
        run: |
          git config user.name "sph-bot"
          git config user.email "sph-bot@users.noreply.github.com"
          git add data/orders.json
          git diff --cached --quiet || git commit -m "progress check [skip ci]"
          git push
