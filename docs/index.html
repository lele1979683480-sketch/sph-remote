<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SPH 下单助手</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>SPH 下单助手</h1>
  <div class="sub" id="cfg-hint">未配置</div>
</header>

<nav class="tabs">
  <button id="tab-new" class="tab active">新建订单</button>
  <button id="tab-list" class="tab">订单列表</button>
  <button id="tab-cfg" class="tab">平台配置</button>
  <button id="tab-log" class="tab">日志</button>
</nav>

<section id="panel-new" class="panel">
  <div class="card">
    <label>视频链接</label>
    <input id="in-url" type="url" placeholder="https://weixin.qq.com/sph/xxxx" class="ipt">
  </div>
  <div class="card">
    <label>下单项目（选填，不填为0）</label>
    <div class="grid2">
      <div class="fld"><span>👍 赞</span><input id="in-like" type="number" min="0" value="0" class="ipt"></div>
      <div class="fld"><span>💗 爱心</span><input id="in-heart" type="number" min="0" value="0" class="ipt"></div>
      <div class="fld"><span>▶️ 播放</span><input id="in-play" type="number" min="0" value="0" class="ipt"></div>
      <div class="fld"><span>🔁 转发</span><input id="in-share" type="number" min="0" value="0" class="ipt"></div>
    </div>
  </div>
  <div class="card">
    <label>连接配置（填一次自动保存）</label>
    <input id="in-owner" placeholder="GitHub 用户名" class="ipt">
    <input id="in-repo" placeholder="仓库名" class="ipt">
    <input id="in-pat" type="password" placeholder="GitHub Token(PAT)" class="ipt">
    <p class="hint">PAT 需要 issues 写入权限；只保存在你手机本地。</p>
  </div>
  <button id="btn-submit" class="btn primary">提交下单</button>
  <p id="msg" class="msg"></p>
</section>

<section id="panel-list" class="panel" hidden>
  <div class="filter">
    <select id="sel-status" class="ipt">
      <option value="">全部状态</option>
      <option value="pending">排队中</option>
      <option value="processing">处理中</option>
      <option value="success">已达标</option>
      <option value="partial_success">部分成功</option>
      <option value="failed">失败</option>
    </select>
  </div>
  <div id="order-list"></div>
</section>

<section id="panel-cfg" class="panel" hidden>
  <div class="card">
    <label>橘子平台（播放/转发下单）</label>
    <input id="in-jz-acct" placeholder="橘子账号" class="ipt" autocomplete="off">
    <input id="in-jz-pwd" type="password" placeholder="橘子密码" class="ipt" autocomplete="new-password">
    <div class="grid2">
      <div class="fld"><span>播放商品编码</span><input id="in-play-goods" placeholder="如 6862" class="ipt"></div>
      <div class="fld"><span>转发商品编码</span><input id="in-share-goods" placeholder="如 9044" class="ipt"></div>
    </div>
  </div>
  <div class="card">
    <label>imt 平台（赞/爱心下单）</label>
    <input id="in-imt-acct" placeholder="imt 账号/手机号" class="ipt" autocomplete="off">
    <input id="in-imt-pwd" type="password" placeholder="imt 密码" class="ipt" autocomplete="new-password">
    <div class="grid2">
      <div class="fld"><span>点赞商品编码</span><input id="in-like-goods" placeholder="赞商品编号" class="ipt"></div>
      <div class="fld"><span>爱心商品编码</span><input id="in-heart-goods" placeholder="爱心商品编号" class="ipt"></div>
    </div>
    <p class="hint">赞和爱心分别下单；若平台为同一任务，两个编码填相同值。</p>
  </div>
  <div class="card">
    <label>登录 Cookie（推荐，绕过平台风控）</label>
    <p class="hint">用手机 Kiwi 浏览器登录橘子/imt 后导出 Cookie 粘贴到下面，保存后自动下单不再需要密码登录。</p>
    <textarea id="in-jz-cookie" class="ipt" rows="3" placeholder="橘子 Cookie：用Kiwi浏览器登录后导出粘贴到这里"></textarea>
    <textarea id="in-imt-cookie" class="ipt" rows="3" placeholder="imt Cookie：同上"></textarea>
  </div>
  <button id="btn-save-cfg" class="btn primary">保存配置到服务器</button>
  <p id="cfg-status" class="hint" style="margin-top:8px"></p>
  <p class="msg" id="cfg-msg"></p>
</section>

<section id="panel-log" class="panel" hidden>
  <div class="card">
    <label>系统控制</label>
    <div id="sys-state" class="sys-state">检查中...</div>
    <button id="btn-pause" class="btn primary" hidden>⏸️ 停止下单</button>
    <button id="btn-resume" class="btn primary" hidden>▶️ 启动下单</button>
    <p class="hint">停止后新订单会被拒绝；达标检查继续运行。</p>
  </div>
  <div class="card">
    <label>运行日志（最近200条）</label>
    <div id="log-list"></div>
  </div>
</section>

<script src="vendor/libsodium.js"></script>
<script src="app.js"></script>
</body>
</html>
